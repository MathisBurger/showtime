name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check (Client)
        run: cd client && cargo fmt --check

      - name: Lint (Client)
        run: cd client && cargo clippy -- -D warnings

      - name: Test (Client)
        run: cd client && cargo test

      - name: Format Check (Server)
        run: cd server-worker && cargo fmt --check

      - name: Lint (Server)
        run: cd server-worker && cargo clippy -- -D warnings

      - name: Test (Server)
        run: cd server-worker && cargo test
